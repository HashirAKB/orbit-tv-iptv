name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - name: Stage artifact
        id: stage
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/OrbitTV.apk
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi
          ls -lh dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.stage.outputs.tag }}" dist/OrbitTV.apk \
            --title "Orbit TV ${{ steps.stage.outputs.tag }}" \
            --notes "Download \`OrbitTV.apk\` below and open it on your phone to install. Android 7.0+.

          Signed with the Android debug key — fine for sideloading, not for Play Store distribution." \
            --latest
